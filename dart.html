<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞镖系统 | 兵种详情</title>
    <style>
        * { margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif; }
        body { background:#081020; color:#f0f4ff; line-height:1.7; }
        header { background:rgba(10,20,40,0.95); padding:18px 5%; display:flex; justify-content:center; align-items:center; position:sticky; top:0; z-index:99; border-bottom:1px solid #1f3a66; }
        nav a { color:#e0e9ff; text-decoration:none; margin:0 12px; font-size:1.1rem; padding:8px 14px; border-radius:8px; transition:0.3s; }
        nav a:hover, nav a.active { background:rgba(79,195,247,0.2); color:#4fc3f7; }
        .container { max-width:1200px; margin:80px auto; padding:0 5%; display:flex; gap:50px; flex-wrap:wrap; align-items:center; }
        .robot-img { flex:1; min-width:300px; height:400px; background:url('assets/robot-06.png') center/contain no-repeat; border:1px solid #243b63; border-radius:12px; }
        .robot-info { flex:1; min-width:300px; }
        .role-tag { color:#4fc3f7; font-size:1rem; margin-bottom:10px; }
        .robot
