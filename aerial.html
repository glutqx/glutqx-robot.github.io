    <style>

        body {

        header {

        nav a {

            transition: all 0.3s ease;
        }
        nav a:hover,

            align-items: center;

        .detail-img {
            flex: 1;
            min-width: 300px;
            height: 400px;
            border-radius: 12px;
            background: url("无人机.png") center/cover no-repeat;
            border: 1px solid rgba(210, 30, 30, 0.3);
            box-shadow: 0 0 15px rgba(210, 30, 30, 0.2);
        }
        .detail-text {
            flex: 1;
            min-width: 300px;
        }
        .detail-sub {
            color: #e03636;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .detail-title {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        .detail-desc {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .tag {
            background-color: rgba(210, 30, 30, 0.15);
            color: #e03636;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(210, 30, 30, 0.25);
        }
        .back-box {
            text-align: center;
            margin: 40px 0;
        }
        .back-btn {
            color: #e03636;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 10px 25px;
            border: 1px solid #e03636;
            border-radius: 8px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: rgba(210, 30, 30, 0.15);
        }
        footer {
            background-color: #101010;
            padding: 35px 20px;
            text-align: center;

            border-top: 1px solid rgba(210, 30, 30, 0.25);
